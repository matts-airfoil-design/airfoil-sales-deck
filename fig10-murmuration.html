<title>fig — murmuration</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #ecece9;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .stage { position: fixed; inset: 0; }
  canvas#sim { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: absolute; inset: 0; pointer-events: none; }
  .ui a { pointer-events: auto; color: inherit; }

  .gear {
    position: absolute; top: 18px; right: 20px;
    width: 36px; height: 36px;
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(120,117,108,0.45);
    border-radius: 50%;
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(5px);
    color: #55524b;
    cursor: pointer;
    transition: transform 0.25s;
  }
  .gear:hover { transform: rotate(40deg); }
  .gear:focus-visible { outline: 2px solid #3e7bd6; outline-offset: 2px; }

  .panel {
    position: absolute; top: 62px; right: 20px;
    width: 232px;
    pointer-events: auto;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(120,117,108,0.35);
    border-radius: 6px;
    padding: 16px 16px 14px;
    color: #3c3a34;
  }
  .panel .field { display: block; margin-bottom: 13px; }
  .panel .lab {
    display: flex; justify-content: space-between; align-items: baseline;
    text-transform: uppercase; letter-spacing: 0.09em;
    font-size: 10.5px; color: #6e6a60;
  }
  .panel .lab output { font-variant-numeric: tabular-nums; color: #3c3a34; letter-spacing: 0; font-size: 11px; }
  .panel input[type="range"] {
    display: block; width: 100%; margin: 7px 0 0;
    accent-color: #3e7bd6;
  }
  .panel input[type="range"]:focus-visible { outline: 2px solid #3e7bd6; outline-offset: 2px; }
  .panel .segrow { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .panel .seg {
    padding: 4px 9px;
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #55524b;
    border: 1px solid rgba(120,117,108,0.5);
    border-radius: 4px; background: none; cursor: pointer;
  }
  .panel .seg.on { background: #3e7bd6; border-color: #3e7bd6; color: #fff; }
  .panel .seg:focus-visible { outline: 2px solid #3e7bd6; outline-offset: 1px; }
  .panel .swrow { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
  .panel .sw {
    width: 23px; height: 23px; padding: 0;
    border: 1px solid rgba(120,117,108,0.5);
    border-radius: 4px; cursor: pointer;
  }
  .panel .sw.on { outline: 2px solid #3e7bd6; outline-offset: 1px; }
  .panel .sw:focus-visible { outline: 2px solid #3e7bd6; outline-offset: 1px; }
  .panel input[type="color"] {
    width: 30px; height: 25px; padding: 0; margin-left: auto;
    border: 1px solid rgba(120,117,108,0.5); border-radius: 4px;
    background: none; cursor: pointer;
  }
</style>

<div class="stage" id="stage">
  <canvas id="sim"></canvas>
  <div class="ui">
    <button class="gear" id="gear" aria-label="Settings" aria-expanded="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div class="panel" id="panel" hidden>
      <label class="field">
        <span class="lab">pixel density <output id="oDen">1.0&times;</output></span>
        <input id="sDen" type="range" min="0.3" max="2" step="0.05" value="1">
      </label>
      <label class="field">
        <span class="lab">animation speed <output id="oSpd">1.0&times;</output></span>
        <input id="sSpd" type="range" min="0.25" max="2.5" step="0.05" value="1">
      </label>
      <label class="field">
        <span class="lab">pixel size <output id="oSiz">1.0&times;</output></span>
        <input id="sSiz" type="range" min="0.5" max="2.4" step="0.05" value="1">
      </label>
      <label class="field">
        <span class="lab">pixel gap <output id="oGap">6%</output></span>
        <input id="sGap" type="range" min="0" max="0.42" step="0.01" value="0.06">
      </label>
      <label class="field">
        <span class="lab">murmuration size <output id="oFlk">1.0&times;</output></span>
        <input id="sFlk" type="range" min="0.5" max="2.2" step="0.05" value="1">
      </label>
      <div class="field">
        <span class="lab">pixels</span>
        <div class="segrow">
          <button class="seg" id="mWater">watercolor</button>
          <button class="seg on" id="mImage">image</button>
          <button class="seg" id="mUpload">upload&hellip;</button>
          <input id="fImg" type="file" accept="image/*" hidden>
        </div>
      </div>
      <div class="field" style="margin-bottom:2px">
        <span class="lab">background</span>
        <div class="swrow" id="swrow">
          <button class="sw on" data-c="#ecece9" style="background:#ecece9" aria-label="Paper"></button>
          <button class="sw" data-c="#f4efe6" style="background:#f4efe6" aria-label="Cream"></button>
          <button class="sw" data-c="#dfe5e0" style="background:#dfe5e0" aria-label="Sage"></button>
          <button class="sw" data-c="#1a1a1e" style="background:#1a1a1e" aria-label="Ink"></button>
          <button class="sw" data-c="#161d33" style="background:#161d33" aria-label="Night"></button>
          <input type="color" id="sBg" value="#ecece9" aria-label="Custom background color">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  // a murmuration quantized to the page grid: hundreds of birds flock with
  // alignment, cohesion and separation, gathered around wandering cores that
  // drift like a starling cloud — stretching, folding, splitting into lobes
  // and re-merging. the birds themselves are invisible; each grid cell a bird
  // passes through lights up as a square and fades behind it, so the cloud
  // reads as ever-changing patterns of pixels inside the grid. the squares
  // can wear the multicolor watercolor, or act as a mask over a hidden
  // image — the flock reveals the picture wherever it flies.
  // the murmurations are living things you conduct: click empty paper and a
  // new flock is born there; click an existing murmuration and it thins and
  // dissipates over time. the pointer is a falcon: the cloud bulges and
  // parts around it.
  const TAU = Math.PI * 2;
  const canvas = document.getElementById('sim');
  const stage = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);

  const NP = new Uint8Array(512);
  for (let i = 0; i < 512; i++) NP[i] = Math.random() * 256 | 0;
  function vn(x, y) {
    const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const h = (i, j) => NP[(NP[(xi + i) & 255] + yi + j) & 255] / 255;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return h(0,0)*(1-u)*(1-v) + h(1,0)*u*(1-v) + h(0,1)*(1-u)*v + h(1,1)*u*v;
  }

  // the birds wear fig-05's multicolor watercolor
  const ATLAS = 768;
  const atlas = document.createElement('canvas');
  atlas.width = atlas.height = ATLAS;
  (() => {
    const a = atlas.getContext('2d');
    a.fillStyle = '#f4efe6';
    a.fillRect(0, 0, ATLAS, ATLAS);
    const hues = [
      [75,143,217],[67,179,160],[76,175,99],[168,201,75],
      [240,138,60],[236,109,155],[139,107,217],
    ];
    for (let i = 0; i < 880; i++) {
      const [r, g, b] = hues[Math.random() * hues.length | 0];
      const x = rnd(0, ATLAS), y = rnd(0, ATLAS), rad = rnd(11, 44);
      const grad = a.createRadialGradient(x, y, 0, x, y, rad);
      grad.addColorStop(0, `rgba(${r},${g},${b},${rnd(0.55, 0.9)})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      a.fillStyle = grad;
      a.beginPath(); a.arc(x, y, rad, 0, TAU); a.fill();
    }
    for (let i = 0; i < 6000; i++) {
      a.fillStyle = `rgba(30,26,20,${rnd(0.02, 0.06)})`;
      a.fillRect(rnd(0, ATLAS), rnd(0, ATLAS), 1.3, 1.3);
    }
  })();
  // crop centers biased toward pigment, so small chips stay vivid
  const CROPS = [];
  (() => {
    const id = atlas.getContext('2d').getImageData(0, 0, ATLAS, ATLAS).data;
    let tries = 0;
    while (CROPS.length < 1600 && tries++ < 24000) {
      const x = 20 + Math.random() * (ATLAS - 40) | 0, y = 20 + Math.random() * (ATLAS - 40) | 0;
      const i = (y * ATLAS + x) * 4;
      const dr = id[i] - 244, dg = id[i + 1] - 239, db = id[i + 2] - 230;
      if (dr * dr + dg * dg + db * db > 2600) CROPS.push([x, y]);
    }
    if (!CROPS.length) CROPS.push([ATLAS / 2, ATLAS / 2]);
  })();

  let W = 0, H = 0, dpr = 1, G = 15;
  let cols = 0, rows = 0;
  let cellI = new Float32Array(0);      // per-cell brightness
  let cellAX = new Float32Array(0);     // per-cell watercolor crop
  let cellAY = new Float32Array(0);
  let birds = [], strikes = [];
  let simT = 0;
  let N = 640;

  // user settings: density & size rebuild the grid/flock, speed scales time,
  // gap insets each square within its cell (fraction of the cell per side),
  // flock scales how large the murmuration itself spreads,
  // mode picks what the pixels wear: watercolor, or a hidden image mask
  const SET = { density: 1, speed: 1, size: 1, gap: 0.06, flock: 1, mode: 'image', bg: '#ecece9' };

  // ---------- the hidden image ----------
  // default mask: a procedural take on the radial tree-ring watercolor —
  // magenta and indigo wedges, coral heart, navy pool, peach rim. the
  // upload button swaps in any image file at runtime.
  function makeDefaultMask() {
    const mw = 760, mh = 520;
    const c = document.createElement('canvas');
    c.width = mw; c.height = mh;
    const g = c.getContext('2d');
    const img = g.createImageData(mw, mh);
    const d = img.data;
    const AN = [
      [-180, 138, 92, 216], [-125, 232, 50, 200], [-95, 255, 60, 190],
      [-60, 90, 85, 215], [-25, 120, 110, 225], [10, 143, 143, 224],
      [50, 240, 144, 122], [95, 245, 180, 154], [140, 154, 122, 224],
      [180, 138, 92, 216],
    ];
    const mix = (a, b, t) => a + (b - a) * t;
    for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
      const nx = (x - mw / 2) / (mw * 0.42), ny = (y - mh / 2) / (mh * 0.46);
      const ang = Math.atan2(ny, nx), deg = ang * 180 / Math.PI;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const r = Math.hypot(nx, ny) * (1 + (vn(ca * 2.2 + 9.3, sa * 2.2 + 4.1) - 0.5) * 0.3);
      let k = 1;
      while (AN[k][0] < deg) k++;
      const t0 = (deg - AN[k - 1][0]) / (AN[k][0] - AN[k - 1][0]);
      let cr = mix(AN[k - 1][1], AN[k][1], t0);
      let cg = mix(AN[k - 1][2], AN[k][2], t0);
      let cb = mix(AN[k - 1][3], AN[k][3], t0);
      // coral heart
      const hw = Math.max(0, 1 - r / 0.34);
      const hb = Math.pow(hw, 1.2) * 0.95;
      cr = mix(cr, 239, hb); cg = mix(cg, 95, hb); cb = mix(cb, 72, hb);
      // navy pool east of center
      const dd = (deg - 25) / 38, rr = (r - 0.42) / 0.17;
      const nb = Math.exp(-(dd * dd + rr * rr)) * 0.85;
      cr = mix(cr, 30, nb); cg = mix(cg, 63, nb); cb = mix(cb, 143, nb);
      // growth rings + radial streaks
      const ring = 0.84 + 0.24 * Math.sin(r * 70 + (vn(deg * 0.05 + 3.7, r * 8.2) - 0.5) * 5);
      const st = 0.82 + 0.36 * vn(deg * 0.65 + 41.2, r * 3.1 + 7.7);
      const light = ring * st + (Math.random() - 0.5) * 0.06;
      cr *= light; cg *= light; cb *= light;
      // irregular blob edge fading to paper
      const edge = 0.88 + (vn(ca * 3.1 + 20.4, sa * 3.1 + 11.8) - 0.5) * 0.24;
      const f = Math.max(0, Math.min(1, (edge - r) / 0.09));
      const ff = f * f * (3 - 2 * f);
      cr = mix(238, cr, ff); cg = mix(238, cg, ff); cb = mix(236, cb, ff);
      const i4 = (y * mw + x) * 4;
      d[i4] = cr; d[i4 + 1] = cg; d[i4 + 2] = cb; d[i4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }
  let maskSrc = makeDefaultMask();
  let maskC = null;
  function buildMask() {
    // cover-fit the source image to the viewport; lit cells sample it 1:1
    maskC = document.createElement('canvas');
    maskC.width = Math.max(2, W * dpr | 0);
    maskC.height = Math.max(2, H * dpr | 0);
    const g = maskC.getContext('2d');
    const sw = maskSrc.width, sh = maskSrc.height;
    const sc = Math.max(maskC.width / sw, maskC.height / sh);
    g.drawImage(maskSrc, (maskC.width - sw * sc) / 2, (maskC.height - sh * sc) / 2, sw * sc, sh * sc);
  }

  // ---------- flocks: living murmurations, born and dispersed by clicks ----------
  const CAP = 2600;
  let flocks = [];
  let nextSeed = 0;
  function noiseCore(seed, t) {
    return [
      W * (0.2 + 0.6 * vn(t * 0.000026 + seed * 17.3, seed * 9.1 + 3.7)),
      H * (0.14 + 0.52 * vn(t * 0.000023 + seed * 7.7, seed * 13.9 + 40)),
    ];
  }
  function makeFlock(x, y) {
    const seed = (nextSeed += 7.13);
    const f = {
      seed, off: [0, 0],
      swirl: Math.random() < 0.5 ? 1 : -1,
      dying: false, core: [0, 0], vel: [0, 0],
    };
    const base = noiseCore(seed, simT);
    if (x !== undefined) f.off = [x - base[0], y - base[1]];
    f.core = [base[0] + f.off[0], base[1] + f.off[1]];
    flocks.push(f);
    return f;
  }
  // how many birds a murmuration is born with, from the density setting
  function perFlockN() {
    return Math.round(Math.max(120, Math.min(CAP, (W * H) / (G * G) / 5.5 * SET.density)) * 0.55);
  }
  function dissolveFlock(f) {
    f.dying = true;
    for (const b of birds) {
      if (b.flock !== f) continue;
      b.dieDelay = rnd(0, 2600);
      b.dieDur = rnd(600, 1600);
      b.vx += rnd(-40, 40); b.vy += rnd(-40, 40);
    }
  }

  // ---------- birds ----------
  function makeBird(f, x, y) {
    const cx = x !== undefined ? x : f.core[0];
    const cy = x !== undefined ? y : f.core[1];
    const ang = rnd(0, TAU), r = rnd(0, x !== undefined ? 60 : 160) * SET.flock;
    const [rax, ray] = CROPS[Math.random() * CROPS.length | 0];
    return {
      x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r,
      vx: rnd(-100, 100), vy: rnd(-100, 100),
      flock: f, fade: 1, dieDelay: 0, dieDur: 0,
      rax, ray,
      seed: rnd(0, 100), ph: rnd(0, TAU),
    };
  }

  let px = -1e4, py = -1e4;
  let followW = 0;   // eases in while the cursor is on the page

  // ---------- update ----------
  function update(now, dt) {
    simT += dt;

    // each murmuration's core wanders its own noise path; a click-born
    // flock starts at the click and eases toward its natural range.
    // while the cursor is on the page, every core leans toward it, so the
    // flocks loosely follow wherever the cursor goes while still wandering
    followW += ((px > -1e3 ? 1 : 0) - followW) * (1 - Math.pow(0.5, dt / 450));
    for (const f of flocks) {
      const b0 = noiseCore(f.seed, simT);
      const b1 = noiseCore(f.seed, simT + 800);
      const k = Math.pow(0.5, dt / 30000);
      f.off[0] *= k; f.off[1] *= k;
      f.core = [
        Math.max(W * 0.08, Math.min(W * 0.92, b0[0] + f.off[0])),
        Math.max(H * 0.1, Math.min(H * 0.9, b0[1] + f.off[1])),
      ];
      if (followW > 0.01) {
        f.core[0] += (px - f.core[0]) * 0.6 * followW;
        f.core[1] += (py - f.core[1]) * 0.6 * followW;
      }
      f.vel = [(b1[0] - b0[0]) / 0.8, (b1[1] - b0[1]) / 0.8];
    }

    // spatial hash for neighbor queries
    const CS = 46;
    const bucket = new Map();
    for (const b of birds) {
      const key = (b.x / CS | 0) * 4096 + (b.y / CS | 0);
      const cell = bucket.get(key);
      if (cell) cell.push(b); else bucket.set(key, [b]);
    }

    const s = dt / 1000;
    const maxV = 160;
    const minV = 55;
    // murmuration size: scales the cloud's equilibrium spread
    const FS = SET.flock;
    const sepR = 15 * Math.pow(FS, 0.7);

    for (const b of birds) {
      let ax = 0, ay = 0;

      // a dissipating bird thins out after its own delay
      if (b.dieDur) {
        if (b.dieDelay > 0) b.dieDelay -= dt;
        else b.fade = Math.max(0, b.fade - dt / b.dieDur);
      }

      // --- boids: separation / alignment / cohesion among neighbors ---
      const bi = b.x / CS | 0, bj = b.y / CS | 0;
      let n = 0, avx = 0, avy = 0, cx = 0, cy = 0;
      let sepx = 0, sepy = 0;
      for (let dj = -1; dj <= 1 && n < 14; dj++) for (let di = -1; di <= 1 && n < 14; di++) {
        const cell = bucket.get((bi + di) * 4096 + (bj + dj));
        if (!cell) continue;
        for (const o of cell) {
          if (o === b) continue;
          const dx = o.x - b.x, dy = o.y - b.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > CS * CS) continue;
          const d = Math.sqrt(d2) || 1;
          if (d < sepR) { sepx -= dx / d * (sepR - d); sepy -= dy / d * (sepR - d); }
          avx += o.vx; avy += o.vy; cx += o.x; cy += o.y;
          if (++n >= 14) break;
        }
      }
      if (n) {
        ax += (avx / n - b.vx) * 2.4;                    // alignment
        ay += (avy / n - b.vy) * 2.4;
        ax += (cx / n - b.x) * 1.5;                      // cohesion
        ay += (cy / n - b.y) * 1.5;
      }
      ax += sepx * 34; ay += sepy * 34;                  // separation

      // --- gathering around the wandering core, stretched along its travel ---
      const co = b.flock.core, cv = b.flock.vel;
      let gx = co[0] - b.x, gy = co[1] - b.y;
      const cs2 = Math.hypot(cv[0], cv[1]);
      if (cs2 > 1) {
        const ux = cv[0] / cs2, uy = cv[1] / cs2;
        const par = gx * ux + gy * uy;                   // along-travel component
        gx -= ux * par * 0.55; gy -= uy * par * 0.55;    // weaker → cloud elongates
      }
      const gd = Math.hypot(gx, gy) || 1;
      const soft = 45 * FS * FS;
      // a dissipating flock loosens its grip as it fades
      const pull = Math.min(220, Math.max(0, gd - soft) * 1.15) * b.fade;
      ax += gx / gd * pull; ay += gy / gd * pull;
      // tangential swirl — the folding, rolling motion of the mass
      const sw = b.flock.swirl * 30 * b.fade;
      ax += -gy / gd * sw; ay += gx / gd * sw;

      // --- turbulence ---
      const ta = vn(b.x * 0.003 + b.seed, b.y * 0.003 + simT * 0.00012) * TAU * 2;
      ax += Math.cos(ta) * 42; ay += Math.sin(ta) * 42;

      // --- falcon (pointer) ---
      const fdx = b.x - px, fdy = b.y - py;
      const fd2 = fdx * fdx + fdy * fdy;
      if (fd2 < 120 * 120) {
        const fd = Math.sqrt(fd2) || 1;
        const f = (1 - fd / 120) * 900;
        ax += fdx / fd * f; ay += fdy / fd * f;
      }

      // --- soft screen bounds ---
      const m = 70;
      if (b.x < m) ax += (m - b.x) * 6;
      if (b.x > W - m) ax -= (b.x - (W - m)) * 6;
      if (b.y < m + 40) ay += (m + 40 - b.y) * 6;
      if (b.y > H - m) ay -= (b.y - (H - m)) * 6;

      b.vx += ax * s; b.vy += ay * s;

      // speed clamp keeps everything bird-like
      const sp = Math.hypot(b.vx, b.vy) || 1;
      const want = 34 + 30 * vn(b.seed, simT * 0.0002);
      const lim = Math.max(minV + want * 0.4, Math.min(maxV, sp));
      b.vx = b.vx / sp * lim; b.vy = b.vy / sp * lim;

      b.x += b.vx * s; b.y += b.vy * s;
    }

    for (const st of strikes) st.t += dt / 900;
    strikes = strikes.filter(st => st.t < 1);

    // dissipated birds are gone; empty dying flocks disappear with them
    if (birds.some(b => b.fade <= 0.02)) {
      birds = birds.filter(b => b.fade > 0.02);
      flocks = flocks.filter(f => !f.dying || birds.some(b => b.flock === f));
    }

    // deposit the flock into the grid: cells light where birds are and
    // fade shortly after they leave, leaving a quantized wake
    const fade = Math.pow(0.5, dt / 150);
    for (let k = 0; k < cellI.length; k++) cellI[k] *= fade;
    for (const b of birds) {
      const i = b.x / G | 0, j = b.y / G | 0;
      if (i < 0 || i >= cols || j < 0 || j >= rows) continue;
      const k = j * cols + i;
      if (cellI[k] < 0.06) { cellAX[k] = b.rax; cellAY[k] = b.ray; }
      cellI[k] = Math.min(1, cellI[k] + dt / 110 * b.fade);
    }
  }

  // ---------- rendering ----------
  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // the flock, quantized: each lit cell is a square watercolor pixel
    // snapped to the grid, easing in as a bird arrives and fading behind it
    const swA = 26, shA = 26;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const k = j * cols + i;
      const t = cellI[k];
      if (t < 0.04) continue;
      const e = 1 - Math.pow(1 - Math.min(1, t), 2);
      const pad = G * SET.gap + (1 - e) * G * 0.2;
      ctx.globalAlpha = Math.min(1, t * 1.15) * 0.95;
      if (SET.mode === 'image') {
        // the pixel is a window: it shows the hidden image at its own spot
        ctx.drawImage(maskC, (i * G + pad) * dpr, (j * G + pad) * dpr,
                      (G - pad * 2) * dpr, (G - pad * 2) * dpr,
                      i * G + pad, j * G + pad, G - pad * 2, G - pad * 2);
      } else {
        ctx.drawImage(atlas, cellAX[k] - swA/2, cellAY[k] - shA/2, swA, shA,
                      i * G + pad, j * G + pad, G - pad * 2, G - pad * 2);
      }
    }
    ctx.globalAlpha = 1;

    // strike rings
    for (const st of strikes) {
      ctx.globalAlpha = Math.sin(Math.min(1, st.t) * Math.PI) * 0.5;
      ctx.strokeStyle = 'rgb(236,109,155)';
      const s = G * (0.7 + st.t * 0.8);
      ctx.strokeRect(st.x - s/2, st.y - s/2, s, s);
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.t * 340, 0, TAU);
      ctx.globalAlpha *= 0.35;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- interaction ----------
  canvas.addEventListener('pointermove', e => {
    const r = canvas.getBoundingClientRect();
    px = e.clientX - r.left; py = e.clientY - r.top;
  });
  canvas.addEventListener('pointerleave', () => { px = -1e4; py = -1e4; });
  canvas.addEventListener('pointerdown', e => {
    const r = canvas.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    strikes.push({ x, y, t: 0 });
    // click a murmuration → it dissipates; click empty paper → one is born
    let hit = null, hd = 70 * 70;
    for (const b of birds) {
      if (b.flock.dying) continue;
      const d = (b.x - x) ** 2 + (b.y - y) ** 2;
      if (d < hd) { hd = d; hit = b.flock; }
    }
    if (hit) dissolveFlock(hit);
    else {
      const f = makeFlock(x, y);
      const n = Math.min(CAP - birds.length, perFlockN());
      for (let k = 0; k < n; k++) birds.push(makeBird(f, x, y));
    }
    if (reduceMotion) { for (let i = 0; i < 120; i++) update(i * 16, 16); draw(performance.now()); }
  });

  // rebuild the grid and flock for the current settings, keeping the sim going
  function rebuild() {
    G = Math.max(6, Math.round(Math.max(11, Math.round(W / 96)) * SET.size));
    cols = Math.ceil(W / G); rows = Math.ceil(H / G);
    cellI = new Float32Array(cols * rows);
    cellAX = new Float32Array(cols * rows);
    cellAY = new Float32Array(cols * rows);
    buildMask();
    // top up living flocks toward the density target; trim the overflow
    if (!flocks.length) { makeFlock(); makeFlock(); }
    const alive = flocks.filter(f => !f.dying);
    const targetTotal = Math.min(CAP, perFlockN() * Math.max(1, alive.length));
    let live = 0;
    for (const b of birds) if (!b.flock.dying) live++;
    let gi = 0;
    while (live < targetTotal && alive.length) {
      birds.push(makeBird(alive[gi++ % alive.length]));
      live++;
    }
    while (live > targetTotal) {
      const i = birds.findIndex(b => !b.flock.dying);
      if (i < 0) break;
      birds.splice(i, 1);
      live--;
    }
    if (reduceMotion) {
      // settle the flock into a believable still, then draw once
      for (let i = 0; i < 240; i++) update(i * 16, 16);
      draw(performance.now());
    }
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(320, r.width); H = Math.max(320, r.height);
    dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
    birds = []; strikes = []; flocks = [];
    rebuild();
  }

  // ---------- settings panel ----------
  const $ = id => document.getElementById(id);
  const panel = $('panel'), gear = $('gear');
  gear.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    gear.setAttribute('aria-expanded', String(!panel.hidden));
  });
  const fmt = v => (Math.round(v * 100) / 100) + '×';
  $('sDen').addEventListener('input', e => {
    SET.density = +e.target.value; $('oDen').textContent = fmt(SET.density); rebuild();
  });
  $('sSiz').addEventListener('input', e => {
    SET.size = +e.target.value; $('oSiz').textContent = fmt(SET.size); rebuild();
  });
  $('sSpd').addEventListener('input', e => {
    SET.speed = +e.target.value; $('oSpd').textContent = fmt(SET.speed);
  });
  $('sGap').addEventListener('input', e => {
    SET.gap = +e.target.value; $('oGap').textContent = Math.round(SET.gap * 100) + '%';
    if (reduceMotion) draw(performance.now());
  });
  $('sFlk').addEventListener('input', e => {
    SET.flock = +e.target.value; $('oFlk').textContent = fmt(SET.flock);
    if (reduceMotion) { for (let i = 0; i < 240; i++) update(i * 16, 16); draw(performance.now()); }
  });
  function setMode(m) {
    SET.mode = m;
    $('mWater').classList.toggle('on', m === 'watercolor');
    $('mImage').classList.toggle('on', m === 'image');
    if (reduceMotion) draw(performance.now());
  }
  $('mWater').addEventListener('click', () => setMode('watercolor'));
  $('mImage').addEventListener('click', () => setMode('image'));
  $('mUpload').addEventListener('click', () => $('fImg').click());
  $('fImg').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onload = () => { maskSrc = im; buildMask(); setMode('image'); };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
  function setBg(c, sw) {
    SET.bg = c;
    document.body.style.background = c;
    for (const b of document.querySelectorAll('.sw')) b.classList.toggle('on', b === sw);
  }
  for (const b of document.querySelectorAll('.sw')) {
    b.addEventListener('click', () => { setBg(b.dataset.c, b); $('sBg').value = b.dataset.c; });
  }
  $('sBg').addEventListener('input', e => setBg(e.target.value, null));

  resize();
  addEventListener('resize', () => { clearTimeout(resize._t); resize._t = setTimeout(resize, 180); });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    if (W) { update(now, dt * SET.speed); draw(now); }
    requestAnimationFrame(frame);
  }
  if (!reduceMotion) requestAnimationFrame(frame);
})();
</script>
